[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daymark"
version = "0.1.0"
description = "Programmatic web search via the Perplexity Search API"
requires-python = ">=3.10"
dependencies = ["perplexityai"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
daymark-search = "daymark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
